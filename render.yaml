services:
  - type: web
    name: kanbot-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
